title: default_author() in aida-core::provenance ignores AIDA_USER on comments, edits, and write events (S2/S4)
description: |-
  In aida-core/src/provenance.rs:399, default_author() checks AIDA_AUTHOR -> USER -> USERNAME, skipping AIDA_USER. Comments and history entries stamp the OS USER instead of AIDA_USER.

  ## Acceptance
  - default_author() resolves AIDA_AUTHOR -> AIDA_USER -> USER -> USERNAME -> Unknown.
