title: aida db sync leaves .aida/cache-db/cache.db stale after moving .aida-store HEAD (S5/S6)
description: |-
  In aida-cli-lib/src/db_cmd.rs:680-783, DbCommand::Sync operates on raw GitBackend and never rebuilds CachedGitBackend (.aida/cache-db/cache.db) after --pull or --push rebases move .aida-store HEAD. Immediately subsequent aida list --format toon calls return stale data and aida cache status reports stale.

  ## Acceptance
  - aida db sync refreshes CachedGitBackend when .aida-store HEAD advances.
