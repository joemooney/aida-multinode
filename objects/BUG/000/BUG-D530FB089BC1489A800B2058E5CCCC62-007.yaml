title: Mailbox recipient discovery on work-node clones and aida init --with-mcp flag gating (S7 & Setup)
description: |-
  1. Work-node clones created via aida node acquire do not populate registry/nodes.toml, causing aida mailbox send --to <user> to refuse with unknown recipient unless aida node team set-role is run interactively.
  2. aida-cli-lib/src/init_cmd.rs:1944,1976 runs codex mcp add even when --with-mcp was not passed.
  3. Update operator-setup.md, multi-node.md, and node acquire help text.

  ## Acceptance
  - Mailbox refusal hints at team role registration or discovers work-node users.
  - aida init gates Codex/Antigravity MCP registration on --with-mcp.
