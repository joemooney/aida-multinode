title: intent_intake::sync_branch fast-forwards foreign writes on an enrolled writer's own feedback branch instead of refusing (S18 / STORY-2652 R4)
description: In Profile v2 per-writer feedback mode (aida intent enroll --role producer --writer-id <id>), each producer owns an exclusive branch refs/heads/aida-feedback-<writer_id>. Per STORY-2652 Advisor Ruling R4, if the remote tip of an enrolled writer's own branch advances ahead of what that clone published, aida intent pull / publish must refuse rather than fast-forwarding. Fixed in aida-cli-lib/src/intent_intake.rs::sync_branch and verified by S18 + per_writer_own_branch_foreign_write_refuses_r4.
