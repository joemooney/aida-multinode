  kind: !Create
    title: GIT_EDITOR=false in caller environment breaks git rebase --continue during store auto-merge (S3)
    description: |-
      In aida-core/src/git_ops.rs (lines 2254 and 2322), rebase_auto_merge_onto invokes git -c core.editor=true rebase --continue without overriding GIT_EDITOR in the subprocess environment. Because GIT_EDITOR takes precedence over core.editor in Git, agent harnesses that export GIT_EDITOR=false cause git rebase --continue to fail and abort the store rebase.

      ## Acceptance
      - rebase_auto_merge_onto passes GIT_EDITOR=true in the child environment.
      - Store auto-merge succeeds when caller environment has GIT_EDITOR=false.
    req_type: Bug
    status: Draft
    priority: High
- id: 01a1e0cf-f88b-7971-871f-63db45584a97
  target_id: 01a1e0cf-f81a-71b2-9178-9a46ea427fd0
  author: aida
