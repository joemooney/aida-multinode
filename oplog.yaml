  timestamp: 2026-11-15T20:04:48.395535915Z
  kind: !Create
    title: merge_spec_upstream discards non-colliding local scalar edits and db_sync_push_leg hides scalar overwrites (S4a)
    description: |-
      In aida-core/src/conflict.rs:428, merge_spec_upstream clones upstream for all scalar fields instead of performing a 3-way per-field merge_scalar against base, dropping non-colliding local scalar edits. In addition, resolve_spec_conflict (git_ops.rs:2762) and db_sync_push_leg (db_cmd.rs:500) do not report which scalar fields were overridden by upstream when a push-retry rebase occurs.

      ## Acceptance
      - merge_spec_upstream uses merge_scalar(base, upstream, local, true) so single-side local scalar edits survive while upstream wins same-field collisions.
      - resolve_spec_conflict and db_sync_push_leg surface overridden scalar fields.
    req_type: Bug
    status: Draft
    priority: High
- id: 01a1e0cf-fbcd-7861-8689-99556105450e
  target_id: 01a1e0cf-fb5a-7141-9dc5-1f41b94b590a
