  kind: !Create
    title: aida remote mirror probes with git ls-remote instead of SSH push-to-create and masks expired glab token errors (S12)
    description: |-
      In aida-cli-lib/src/gitlab_project_create.rs:426 (ensure_gitlab_project_exists), aida remote mirror --url probes a new GitLab remote with git ls-remote --heads before any git push. Because git ls-remote never triggers GitLab's native SSH push-to-create, it always fails with 'The project you were looking for could not be found' on a not-yet-created repo and forces API creation via glab. Furthermore, when the glab OAuth/PAT token is expired (HTTP 401 invalid_token), parse_namespace_id (line 223) fails with 'could not read the id of GitLab namespace' and aborts aida remote mirror before .aida-store remote gitlab, [store.sync] mirror_remotes, or the pre-push hook are configured.

      ## Acceptance
      - aida remote mirror attempts SSH push-to-create (or wires the mirror config and hooks before probing) so SSH push-to-create works without glab when GitLab supports it.
      - glab API errors surface the actual error_description (e.g. expired token) instead of a generic namespace id parse error.
    req_type: Bug
    status: Draft
    priority: High
